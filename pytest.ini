[pytest]
minversion = 8.0
addopts = -ra
testpaths = tests
markers =
    unit: fast, isolated tests that mock external dependencies
    smoke: less fast, focus on core functionality for essential confidence checks
    integration: Tests requiring a configured CAN interface (for example vcan0)
    negative: tests that validate invalid inputs and error handling paths
    failure_scenario: opt-in tests that intentionally fail to generate realistic logs for learning
